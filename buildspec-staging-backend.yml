version: 0.2

env:
  variables:
    GRADLE_USER_HOME: /root/.cache/poudy-gradle/staging-be

phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - command -v docker
      - docker info >/dev/null
      - rm -rf "${CODEBUILD_SRC_DIR}/.artifacts" "${CODEBUILD_SRC_DIR}/.docker-context"
      - mkdir -p "${CODEBUILD_SRC_DIR}/.artifacts/app" "${CODEBUILD_SRC_DIR}/.artifacts/scripts" "${CODEBUILD_SRC_DIR}/.artifacts/systemd" "${CODEBUILD_SRC_DIR}/.docker-context/backend"
  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/server" && "${CODEBUILD_SRC_DIR}/deploy/scripts/measure-build.sh" gradle ./gradlew bootJar --no-daemon --build-cache --profile
      - |
        set -Eeuo pipefail
        mapfile -t backend_jars < <(
          find "${CODEBUILD_SRC_DIR}/server/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            -print
        )
        test "${#backend_jars[@]}" -eq 1

        context="${CODEBUILD_SRC_DIR}/.docker-context/backend"
        image_tag="poudy-backend:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
        cp "${backend_jars[0]}" "${context}/app.jar"
        cp "${CODEBUILD_SRC_DIR}/deploy/docker/backend/Dockerfile" "${context}/Dockerfile"

        docker build --pull --platform linux/arm64 --tag "${image_tag}" "${context}"
        docker save "${image_tag}" | gzip -1 > "${CODEBUILD_SRC_DIR}/.artifacts/app/image.tar.gz"
        printf '%s\n' "${image_tag}" > "${CODEBUILD_SRC_DIR}/.artifacts/app/image-reference.txt"

        cp "${CODEBUILD_SRC_DIR}/deploy/codedeploy/backend-container/appspec.yml" "${CODEBUILD_SRC_DIR}/.artifacts/appspec.yml"
        cp -R "${CODEBUILD_SRC_DIR}/deploy/codedeploy/backend-container/scripts/." "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"
        cp "${CODEBUILD_SRC_DIR}/deploy/codedeploy/backend/scripts/validate-database.sh" "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"
        cp "${CODEBUILD_SRC_DIR}/deploy/systemd/poudy-backend-container.service" "${CODEBUILD_SRC_DIR}/.artifacts/systemd/poudy-backend.service"
        chmod +x "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"*.sh
        printf 'commit=%s\n' "${CODEBUILD_RESOLVED_SOURCE_VERSION}" > "${CODEBUILD_SRC_DIR}/.artifacts/build-metadata.txt"
  post_build:
    commands:
      - test -s "${CODEBUILD_SRC_DIR}/.artifacts/app/image.tar.gz"
      - test -s "${CODEBUILD_SRC_DIR}/.artifacts/app/image-reference.txt"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/appspec.yml"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/scripts/validate-database.sh"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/scripts/application-start.sh"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/systemd/poudy-backend.service"

artifacts:
  base-directory: .artifacts
  files:
    - appspec.yml
    - scripts/**/*
    - systemd/**/*
    - app/**/*
    - build-metadata.txt
    - metrics/**/*
  discard-paths: no

# S3 저장 경로를 프로젝트별로 분리한다. 고정 캐시를 갱신해 커밋별 캐시 누적을 피한다.
cache:
  paths:
    - '/root/.cache/poudy-gradle/staging-be/caches/**/*'
    - '/root/.cache/poudy-gradle/staging-be/wrapper/**/*'
