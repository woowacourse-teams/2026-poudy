version: 0.2

env:
  variables:
    PNPM_VERSION: "11.21.0"
    # Next.js의 NEXT_PUBLIC_* 값은 빌드 결과물에 포함되므로 CodeBuild에서 지정합니다.
    # 브라우저 번들은 공개 Nginx의 /api/*를 사용합니다. 서버 컴포넌트와 런타임
    # sitemap은 EC2에서 systemd가 주입하는 로컬 전용 API 주소를 사용합니다.
    # prerender가 https://poudy.site/api를 부르므로 백엔드 배포 다음 단계에서 빌드합니다.
    NEXT_PUBLIC_API_MOCKING: ""
    NEXT_PUBLIC_API_BASE_URL: "https://poudy.site"
    NEXT_PUBLIC_ENVIRONMENT: "production"
    NEXT_PUBLIC_SITE_URL: "https://poudy.site"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --global "pnpm@${PNPM_VERSION}"
  pre_build:
    commands:
      - test "$(uname -m)" = "aarch64"
      - rm -rf "${CODEBUILD_SRC_DIR}/.poudy-package" "${CODEBUILD_SRC_DIR}/.artifacts"
  build:
    commands:
      - ./deploy/scripts/package-frontend.sh "${CODEBUILD_SRC_DIR}/.poudy-package/frontend"
      # 디자인 시스템 Storybook 정적 파일도 함께 올린다. 프론트 EC2 의 Nginx 가 그대로 내보낸다(#859).
      - ./deploy/scripts/package-storybook.sh "${CODEBUILD_SRC_DIR}/.poudy-package/storybook"
      - mkdir -p "${CODEBUILD_SRC_DIR}/.artifacts/app" "${CODEBUILD_SRC_DIR}/.artifacts/scripts/lib" "${CODEBUILD_SRC_DIR}/.artifacts/nginx" "${CODEBUILD_SRC_DIR}/.artifacts/systemd" "${CODEBUILD_SRC_DIR}/.artifacts/storybook"
      - cp -R "${CODEBUILD_SRC_DIR}/.poudy-package/frontend/." "${CODEBUILD_SRC_DIR}/.artifacts/app/"
      - cp -R "${CODEBUILD_SRC_DIR}/.poudy-package/storybook/." "${CODEBUILD_SRC_DIR}/.artifacts/storybook/"
      - cp deploy/codedeploy/frontend/appspec.yml "${CODEBUILD_SRC_DIR}/.artifacts/appspec.yml"
      - cp -R deploy/codedeploy/frontend/scripts/. "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"
      - cp deploy/scripts/lib/frontend-certificate.sh deploy/scripts/lib/frontend-site.sh "${CODEBUILD_SRC_DIR}/.artifacts/scripts/lib/"
      - cp deploy/nginx/ec2-nginx.conf deploy/nginx/ec2-frontend.conf deploy/nginx/ec2-frontend-https.conf "${CODEBUILD_SRC_DIR}/.artifacts/nginx/"
      - cp deploy/config/frontend-site-production.env "${CODEBUILD_SRC_DIR}/.artifacts/nginx/frontend-site.env"
      - cp deploy/systemd/poudy-frontend.service "${CODEBUILD_SRC_DIR}/.artifacts/systemd/"
      - chmod +x "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"*.sh
      - printf 'commit=%s\n' "${CODEBUILD_RESOLVED_SOURCE_VERSION}" > "${CODEBUILD_SRC_DIR}/.artifacts/build-metadata.txt"
  post_build:
    commands:
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/app/server.js"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/storybook/index.html"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/appspec.yml"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/nginx/frontend-site.env"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/scripts/lib/frontend-site.sh"

artifacts:
  base-directory: .artifacts
  files:
    - appspec.yml
    - scripts/**/*
    - nginx/**/*
    - systemd/**/*
    - app/**/*
    - storybook/**/*
    - build-metadata.txt
  discard-paths: no
