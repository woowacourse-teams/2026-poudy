version: 0.0
os: linux
file_exists_behavior: OVERWRITE

files:
  - source: app
    destination: /opt/poudy/frontend
  - source: nginx
    destination: /opt/poudy/frontend-nginx
  - source: systemd
    destination: /etc/systemd/system
  # 디자인 시스템 Storybook 정적 파일. Nginx 가 직접 읽는다(#859).
  - source: storybook
    destination: /var/www/poudy-storybook

hooks:
  BeforeInstall:
    - location: scripts/before-install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after-install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/application-start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate-service.sh
      timeout: 1200
      runas: root
