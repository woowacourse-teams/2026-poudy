version: 0.0
os: linux

files:
  - source: app
    destination: /opt/poudy/frontend
    overwrite: true

hooks:
  BeforeInstall:
    - location: scripts/before-install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after-install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/application-start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate-service.sh
      timeout: 120
      runas: root
