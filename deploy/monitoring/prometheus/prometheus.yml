global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          env: monitoring
          service: prometheus

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
        labels:
          environment: monitoring
          service: blackbox-exporter

  - job_name: poudy_public_endpoints
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://poudy.site/categories
        labels:
          environment: production
          endpoint: frontend_page
          service: poudy-frontend
      - targets:
          - https://poudy.site/api/categories
        labels:
          environment: production
          endpoint: public_api
          service: poudy-backend
      - targets:
          - https://staging.poudy.site/categories
        labels:
          environment: staging
          endpoint: frontend_page
          service: poudy-frontend
      - targets:
          - https://staging.poudy.site/api/categories
        labels:
          environment: staging
          endpoint: public_api
          service: poudy-backend
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
