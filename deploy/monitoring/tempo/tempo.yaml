# Monitoring EC2 의 단일 Tempo(모놀리식). staging 백엔드 트레이스만 받는다.
# 메모리가 작은 호스트라 보존 기간을 짧게 두고 로컬 디스크에 저장한다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # Alloy 는 OTLP HTTP 로 보낸다. gRPC 는 열지 않는다.
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # 블록을 자주 내려 메모리에 오래 쥐고 있지 않는다.
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    # 하루. 오래된 블록을 지우는 유일한 장치라 디스크 상한을 겸한다(크기 기준 삭제는 없다).
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      # 수신 상한 × 보존 기간이 디스크 여유 안에 들어오게 둔다. 2MB/s·72h 로는 막지 못해
      # 2026-11 외부 유입으로 디스크가 89% 까지 찼다. 평소 staging 은 분당 수십 span 이다.
      rate_limit_bytes: 500000
      burst_size_bytes: 1000000
      max_traces_per_user: 5000
    global:
      max_bytes_per_trace: 2000000

usage_report:
  reporting_enabled: false
