services:
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: poudy-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    restart: unless-stopped
    volumes:
      - /opt/poudy-monitoring/config/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    mem_limit: 128m
    mem_reservation: 32m

  # staging 백엔드 트레이스 저장소. staging Alloy 가 traces-write.poudy.site(Cloudflare Tunnel/Access)로 보낸다.
  # Grafana 는 같은 Compose 네트워크에서 http://tempo:3200 으로 조회한다.
  tempo:
    image: grafana/tempo:2.8.2
    container_name: poudy-tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
    restart: unless-stopped
    user: "10001:10001"
    environment:
      # mem_limit 보다 낮게 두어 컨테이너가 OOM kill 되기 전에 GC 가 먼저 돈다.
      GOMEMLIMIT: 300MiB
    volumes:
      - /opt/poudy-monitoring/config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /opt/poudy-monitoring/data/tempo:/var/tempo
    # 호스트 포트는 열지 않는다. 같은 Compose 네트워크의 poudy-cloudflared 가 http://tempo:4318 로 넘긴다.
    mem_limit: 384m
    mem_reservation: 128m
