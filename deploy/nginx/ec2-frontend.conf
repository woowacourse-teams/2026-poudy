upstream poudy_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    server_name poudy.site _;

    client_max_body_size 10m;

    # 공개 브라우저 API만 사용자 IP별로 제한합니다. HTML/RSC와 로컬 SSR API
    # listener에는 이 지시어의 key가 생성되지 않습니다.
    limit_req zone=poudy_public_api burst=120 nodelay;
    limit_req zone=poudy_share_match_api burst=30 nodelay;
    limit_req_status 429;
    limit_req_dry_run off;

    # 인증서 발급 전에는 HTTP를 유지합니다. Certbot webroot challenge가
    # 성공한 뒤 HTTPS 설정으로 전환하면 일반 요청은 HTTPS로 리다이렉트됩니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime sitemap은 요청 헤더와 query에 무관한 공개 XML입니다. upstream
    # 요청도 한 표현으로 정규화하고 완성된 200 응답만 파일 캐시에 저장합니다.
    location = /sitemap-pages.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host poudy.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /sitemap-products.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host poudy.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 12h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /sitemap-ingredients.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host poudy.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    # 카테고리는 사용자·쿼리별 응답이 없는 읽기 전용 API다. Origin을 캐시 키에
    # 포함해 CORS 응답 헤더가 다른 출처에 재사용되지 않도록 한다.
    location = /api/categories {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_cache poudy_categories;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme://$host$request_uri|origin=$http_origin";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    # Next.js 빌드 산출물은 content hash를 포함하므로 장기 브라우저·Nginx
    # 캐시가 안전하다. 공개 파일은 이름이 재사용될 수 있어 1시간만 보관한다.
    location ^~ /_next/static/ {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache poudy_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme://$host$request_uri";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location ~* \.(?:css|js|mjs|map|svg|ico|png|jpe?g|gif|webp|woff2?)$ {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache poudy_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme://$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /api/feedback/images {
        client_max_body_size 26m;
        error_page 413 = @feedback_image_payload_too_large;
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 최대 5장의 검증과 순차 S3 저장이 프록시보다 먼저 완료되게 한다.
        proxy_read_timeout 180s;
    }

    location @feedback_image_payload_too_large {
        default_type application/problem+json;
        return 413 '{"title":"Payload Too Large","status":413,"detail":"요청 본문 크기가 허용 범위를 초과했습니다.","code":"PAYLOAD_TOO_LARGE"}';
    }

    location = /api/feedback {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # claim·copy·commit의 제한된 순차 S3 호출이 결과를 확정할 시간을 둔다.
        proxy_read_timeout 180s;
    }

    location ^~ /api/ {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# Next.js 서버 컴포넌트와 런타임 sitemap만 사용하는 로컬 API 입구입니다.
# 백엔드 주소는 공개 프록시와 같은 poudy_backend upstream 한 곳에서 관리합니다.
server {
    listen 127.0.0.1:8081;
    server_name 127.0.0.1 localhost;

    client_max_body_size 10m;

    location = /api/categories {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_cache poudy_categories;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "internal:$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location ^~ /api/ {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
