user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # 동일한 읽기 요청이 Spring Boot까지 반복해서 도달하지 않도록 Nginx가
    # 캐시 파일을 보관합니다. categories 응답은 짧은 TTL을 사용하고,
    # 정적 자산은 해시된 Next.js 경로를 중심으로 더 오래 보관합니다.
    proxy_cache_path /var/cache/nginx/poudy_categories
        levels=1:2
        keys_zone=poudy_categories:10m
        max_size=32m
        inactive=60m
        use_temp_path=off;
    proxy_cache_path /var/cache/nginx/poudy_static
        levels=1:2
        keys_zone=poudy_static:16m
        max_size=128m
        inactive=1d
        use_temp_path=off;

    # Query strings, Referer, cookies, and authorization headers are not logged.
    # This keeps access logs useful for infrastructure operations without making
    # URL tokens or other request metadata part of the log payload.
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time $upstream_status '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
