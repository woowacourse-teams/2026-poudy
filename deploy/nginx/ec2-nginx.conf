user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # 공개 API만 IP별 제한 zone에 넣습니다. 빈 key는 limit_req_zone이
    # 집계하지 않으므로 같은 Nginx의 로컬 API listener와 나머지 요청은
    # 공개 사용자 제한에 포함되지 않습니다.
    map $uri $poudy_public_api_key {
        default "";
        "~^/api(?:;[^/]*)?/" $binary_remote_addr;
    }

    # 공유 텍스트 식별은 일반 검색 입력보다 호출 빈도가 낮으므로 추가 제한합니다.
    # Spring MVC가 제거하는 세미콜론 path parameter로 우회할 수 없게 합니다.
    map $uri $poudy_share_match_api_key {
        default "";
        "~^/api(?:;[^/]*)?/products(?:;[^/]*)?/share-matches(?:;[^/]*)?$" $binary_remote_addr;
    }

    # Next.js는 미리 렌더링한 HTML·RSC 응답에 CDN용 s-maxage와 stale-while-revalidate를
    # 붙입니다. 앞단에 CDN이 없어 브라우저가 이 값을 받으면, 배포 전 빌드의 RSC 응답을
    # 서버에 묻지 않고 꺼내 써서 지난 빌드 chunk를 실행합니다. 이 형태의 값만 브라우저가
    # 매번 확인하게 바꿉니다. 304 응답에도 같은 값이 실려 오므로 Content-Type으로 고르지
    # 않습니다. max-age로 시작하는 OG 이미지 등의 값은 그대로 둡니다.
    map $upstream_http_cache_control $poudy_browser_cache_control {
        default $upstream_http_cache_control;
        "~^s-maxage=" "private, no-cache";
    }

    # 팀 확정 TTL은 검토한 공개 GET 경로에만 적용합니다. 새 API는 기본 제외합니다.
    # 세션/인증, 내 필터 요청과 upstream의 private/no-store/Set-Cookie 보호는 유지합니다.
    map $uri $poudy_api_skip_cache {
        default 1;
        /api/categories 0;
        /api/brands 0;
        /api/ingredient-groups 0;
        /api/skin-types 0;
        /api/exclude-codes 0;
        /api/banners 0;
        /api/products 0;
        /api/products/count 0;
        /api/products/rankings 0;
        /api/products/related-keywords 0;
        /api/products/suggestions 0;
        /api/products/share-matches 0;
        /api/ingredients 0;
        /api/ingredients/suggestions 0;
        /api/search-keywords/rankings 0;
        /api/sitemap 0;
        ~^/api/brands/[0-9]+$ 0;
        ~^/api/curations/[0-9]+$ 0;
        ~^/api/products/[0-9]+(?:/similarities)?$ 0;
        ~^/api/ingredients/[0-9]+$ 0;
        ~^/api/ingredient-groups/[A-Z0-9_]+$ 0;
    }

    map $args $poudy_api_personal_query {
        default 0;
        ~*(^|&)myFilter(?:=|&|$) 1;
    }

    limit_req_zone $poudy_public_api_key zone=poudy_public_api:10m rate=30r/s;
    limit_req_zone $poudy_share_match_api_key zone=poudy_share_match_api:10m rate=10r/s;

    # 공개 API는 30초/1분/10분 TTL을 사용합니다. 기존 categories 저장소와
    # zone 이름을 재사용해 캐시를 삭제하지 않습니다. 최대 크기 32MiB도 유지합니다.
    # 정적 자산과 sitemap은 별도 저장소를 사용합니다.
    proxy_cache_path /var/cache/nginx/poudy_categories
        levels=1:2
        keys_zone=poudy_categories:10m
        max_size=32m
        inactive=60m
        use_temp_path=off;
    proxy_cache_path /var/cache/nginx/poudy_static
        levels=1:2
        keys_zone=poudy_static:16m
        max_size=128m
        inactive=1d
        use_temp_path=off;
    proxy_cache_path /var/cache/nginx/poudy_sitemaps
        levels=1:2
        keys_zone=poudy_sitemaps:10m
        max_size=512m
        inactive=72h
        use_temp_path=off;

    # Query strings, Referer, cookies, and authorization headers are not logged.
    # This keeps access logs useful for infrastructure operations without making
    # URL tokens or other request metadata part of the log payload.
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time $upstream_status '
                    '"$http_user_agent" listener=$server_port limit_req=$limit_req_status '
                    'host=$host cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
