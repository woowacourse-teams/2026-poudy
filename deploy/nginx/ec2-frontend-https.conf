upstream poudy_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    server_name poudy.site _;

    client_max_body_size 10m;

    # 인증서 갱신을 위해 HTTP-01 challenge는 HTTP로 제공합니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name poudy.site _;

    ssl_certificate /etc/letsencrypt/live/poudy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poudy.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/feedback/images {
        client_max_body_size 26m;
        error_page 413 = @feedback_image_payload_too_large;
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 최대 5장의 검증과 순차 S3 저장이 프록시보다 먼저 완료되게 한다.
        proxy_read_timeout 180s;
    }

    location @feedback_image_payload_too_large {
        default_type application/problem+json;
        return 413 '{"title":"Payload Too Large","status":413,"detail":"요청 본문 크기가 허용 범위를 초과했습니다.","code":"PAYLOAD_TOO_LARGE"}';
    }

    location = /api/feedback {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # claim·copy·commit의 제한된 순차 S3 호출이 결과를 확정할 시간을 둔다.
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
