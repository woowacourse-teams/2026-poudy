upstream poudy_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    server_name __POUDY_SITE_HOST__ __POUDY_SITE_ALIASES__ _;

    client_max_body_size 10m;

    # 인증서 갱신을 위해 HTTP-01 challenge는 HTTP로 제공합니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://__POUDY_SITE_HOST__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name __POUDY_SITE_ALIASES__ _;

    ssl_certificate /etc/letsencrypt/live/__POUDY_SITE_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__POUDY_SITE_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 대표 도메인으로 경로와 query string을 그대로 보존해 통합합니다.
    return 301 https://__POUDY_SITE_HOST__$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __POUDY_SITE_HOST__;

    ssl_certificate /etc/letsencrypt/live/__POUDY_SITE_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__POUDY_SITE_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    # 공개 브라우저 API만 사용자 IP별로 제한합니다. HTTP redirect, HTML/RSC와
    # 로컬 SSR API listener에는 이 지시어의 key가 생성되지 않습니다.
    limit_req zone=poudy_public_api burst=120 nodelay;
    limit_req zone=poudy_share_match_api burst=30 nodelay;
    limit_req_status 429;
    limit_req_dry_run off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime sitemap은 요청 헤더와 query에 무관한 공개 XML입니다. upstream
    # 요청도 한 표현으로 정규화하고 완성된 200 응답만 파일 캐시에 저장합니다.
    location = /sitemap-pages.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host __POUDY_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /sitemap-products.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host __POUDY_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /sitemap-ingredients.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host __POUDY_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    # 인덱스와 RSS 는 요청마다 API 를 여러 번 불러 만들므로 하위 사이트맵과 같은 캐시에 둔다.
    # 같은 poudy_sitemaps 영역이라 배포할 때 함께 비운다.
    location = /sitemap.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host __POUDY_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /rss.xml {
        proxy_pass http://poudy_frontend$uri;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host __POUDY_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header RSC "";
        proxy_set_header Next-Router-State-Tree "";
        proxy_set_header Next-Router-Prefetch "";
        proxy_set_header Next-Router-Segment-Prefetch "";
        proxy_set_header Next-Url "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_cache poudy_sitemaps;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "sitemap:$uri";
        proxy_cache_valid 200 12h;
        proxy_cache_lock on;
        proxy_cache_lock_age 65s;
        proxy_cache_lock_timeout 70s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header X-Poudy-Cache $upstream_cache_status always;
    }


    # Next.js 빌드 산출물은 content hash를 포함하므로 장기 브라우저·Nginx
    # 캐시가 안전하다. 공개 파일은 이름이 재사용될 수 있어 1시간만 보관한다.
    # 장기 캐시 헤더는 성공 응답에만 붙인다. always를 두면 없는 chunk의 404나
    # 재시작 중의 502까지 브라우저가 1년 동안 보관한다.
    location ^~ /_next/static/ {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache poudy_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme://$host$request_uri";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location ~* \.(?:css|js|mjs|map|svg|ico|png|jpe?g|gif|webp|woff2?)$ {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache poudy_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme://$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Poudy-Cache $upstream_cache_status always;
    }

    location = /api/pending-images {
        client_max_body_size 26m;
        error_page 413 = @pending_image_payload_too_large;
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 최대 5장의 검증과 순차 S3 저장이 프록시보다 먼저 완료되게 한다.
        proxy_read_timeout 180s;
    }

    location @pending_image_payload_too_large {
        default_type application/problem+json;
        return 413 '{"title":"Payload Too Large","status":413,"detail":"요청 본문 크기가 허용 범위를 초과했습니다.","code":"PAYLOAD_TOO_LARGE"}';
    }

    location = /api/feedbacks {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # claim·copy·commit의 제한된 순차 S3 호출이 결과를 확정할 시간을 둔다.
        proxy_read_timeout 180s;
    }

    location ^~ /api/ {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_cache poudy_categories;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme://$host$request_uri|origin=$http_origin";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie $poudy_api_skip_cache $poudy_api_personal_query;
        proxy_no_cache $http_authorization $http_cookie $poudy_api_skip_cache $poudy_api_personal_query;
        add_header X-Poudy-Cache $upstream_cache_status always;

        # ^~ API 아래에 두어 정적 파일 정규식과 분리하고 공통 보호 조건을 상속합니다.
        location ~ ^/api/(?:categories|brands/[0-9]+|ingredient-groups|skin-types|exclude-codes)$ {
            proxy_pass http://poudy_backend;
            proxy_cache_valid 200 10m;
        }

        location ~ ^/api/(?:brands|banners|curations/[0-9]+|products/[0-9]+(?:/similarities)?)$ {
            proxy_pass http://poudy_backend;
            proxy_cache_valid 200 1m;
        }

        # ^~ 접두사가 바깥 정규식 location 탐색을 막으므로 제품 정보 정정 요청은 안쪽에서 고른다.
        # 헤더와 연결 설정은 바깥 블록을 물려받는다. proxy_pass 만 물려받지 않아 다시 적는다.
        location ~ ^/api/products/[0-9]+/correction-requests$ {
            proxy_pass http://poudy_backend;
            # 의견 등록과 같은 claim·copy·commit S3 호출이 결과를 확정할 시간을 둔다.
            proxy_read_timeout 180s;
        }
    }

    location / {
        proxy_pass http://poudy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # 브라우저용 값은 nginx.conf의 poudy_browser_cache_control map을 따릅니다.
        # 오류 응답에도 Next.js가 정한 값을 그대로 전하도록 always를 둡니다.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $poudy_browser_cache_control always;
    }
}

# __POUDY_STORYBOOK_BEGIN__
# 디자인 시스템 Storybook 정적 사이트입니다(#859). 인증서가 이 도메인을 포함할 때만
# 배포 스크립트가 이 구간을 남깁니다. 앱과 같은 인증서 lineage를 씁니다.
server {
    listen 80;
    server_name __POUDY_STORYBOOK_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://__POUDY_STORYBOOK_HOST__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __POUDY_STORYBOOK_HOST__;

    ssl_certificate /etc/letsencrypt/live/__POUDY_SITE_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__POUDY_SITE_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # CodeBuild가 만든 정적 파일만 내보냅니다. 프론트 EC2에서는 빌드하지 않습니다.
    root /var/www/poudy-storybook;
    index index.html;

    # 팀 내부 문서라 검색 엔진이 색인하지 않게 합니다. location에서 add_header를 쓰면
    # 바깥 add_header를 물려받지 않으므로 그곳에도 다시 적습니다.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # assets/ 의 파일은 이름에 content hash가 있어 오래 보관해도 됩니다. 나머지(HTML,
    # index.json, sb-manager 등)는 이름이 그대로라 배포마다 새로 받게 합니다.
    location ^~ /assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

# __POUDY_STORYBOOK_END__
# Next.js 서버 컴포넌트와 런타임 sitemap만 사용하는 로컬 API 입구입니다.
# 백엔드 주소는 공개 프록시와 같은 poudy_backend upstream 한 곳에서 관리합니다.
server {
    listen 127.0.0.1:8081;
    server_name 127.0.0.1 localhost;

    client_max_body_size 10m;


    location ^~ /api/ {
        proxy_pass http://poudy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_cache poudy_categories;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "internal:$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie $poudy_api_skip_cache $poudy_api_personal_query;
        proxy_no_cache $http_authorization $http_cookie $poudy_api_skip_cache $poudy_api_personal_query;
        add_header X-Poudy-Cache $upstream_cache_status always;

        # ^~ API 아래에 두어 정적 파일 정규식과 분리하고 공통 보호 조건을 상속합니다.
        location ~ ^/api/(?:categories|brands/[0-9]+|ingredient-groups|skin-types|exclude-codes)$ {
            proxy_pass http://poudy_backend;
            proxy_cache_valid 200 10m;
        }

        location ~ ^/api/(?:brands|banners|curations/[0-9]+|products/[0-9]+(?:/similarities)?)$ {
            proxy_pass http://poudy_backend;
            proxy_cache_valid 200 1m;
        }
    }

    location / {
        return 404;
    }
}
