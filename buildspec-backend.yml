version: 0.2

env:
  variables:
    GRADLE_USER_HOME: /root/.cache/poudy-gradle/production-be

phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - test "$(uname -m)" = "aarch64"
      - rm -rf "${CODEBUILD_SRC_DIR}/.artifacts"
      - mkdir -p "${CODEBUILD_SRC_DIR}/.artifacts/app" "${CODEBUILD_SRC_DIR}/.artifacts/scripts" "${CODEBUILD_SRC_DIR}/.artifacts/systemd"
  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/server" && "${CODEBUILD_SRC_DIR}/deploy/scripts/measure-build.sh" gradle ./gradlew clean bootJar --no-daemon --build-cache --profile
      - |
        set -Eeuo pipefail
        shopt -s nullglob
        backend_jars=("${CODEBUILD_SRC_DIR}"/server/build/libs/*.jar)
        test "${#backend_jars[@]}" -eq 1
        cp "${backend_jars[0]}" "${CODEBUILD_SRC_DIR}/.artifacts/app/app.jar"
      - cp "${CODEBUILD_SRC_DIR}/deploy/codedeploy/backend/appspec.yml" "${CODEBUILD_SRC_DIR}/.artifacts/appspec.yml"
      - cp -R "${CODEBUILD_SRC_DIR}/deploy/codedeploy/backend/scripts/." "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"
      - cp "${CODEBUILD_SRC_DIR}/deploy/systemd/poudy-backend.service" "${CODEBUILD_SRC_DIR}/.artifacts/systemd/"
      - cp "${CODEBUILD_SRC_DIR}/deploy/systemd/poudy-backend.service.d/20-config-source.conf" "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"
      - chmod +x "${CODEBUILD_SRC_DIR}/.artifacts/scripts/"*.sh
      - printf 'commit=%s\n' "${CODEBUILD_RESOLVED_SOURCE_VERSION}" > "${CODEBUILD_SRC_DIR}/.artifacts/build-metadata.txt"
  post_build:
    commands:
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/app/app.jar"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/appspec.yml"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/scripts/validate-database.sh"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/systemd/poudy-backend.service"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/scripts/20-config-source.conf"

artifacts:
  base-directory: .artifacts
  files:
    - appspec.yml
    - scripts/**/*
    - systemd/**/*
    - app/**/*
    - build-metadata.txt
    - metrics/**/*
  discard-paths: no

# staging과 다른 S3 접두사에서 운영 Gradle 캐시만 복원한다.
cache:
  paths:
    - "/root/.cache/poudy-gradle/production-be/caches/**/*"
    - "/root/.cache/poudy-gradle/production-be/wrapper/**/*"
