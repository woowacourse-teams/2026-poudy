plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.poudy.modules.appupdate'
version = '0.1.0'

android {
  namespace "com.poudy.modules.appupdate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
}
