# staging 화면은 nginx 가 같은 오리진에서 /api 를 프록시하므로 CORS 가 필요 없다.
# PR preview(pr-<번호>.preview.poudy.site)는 Vercel 에서 열려 staging API 를 다른 오리진으로 부른다.
poudy:
  analytics:
    environment: staging
  admin:
    url: https://staging.poudy.site/admin
  notice:
    image-s3:
      prefix: ${POUDY_NOTICE_S3_PREFIX:poudy/staging/notices/}
  image:
    s3:
      feedback-prefix: poudy/staging/feedback/images/
      profile-prefix: poudy/staging/users/profile/
  cors:
    allowed-origins: https://*.preview.poudy.site

# 1단계 트레이스. 같은 호스트의 Alloy(OTLP HTTP 4318)로 보내고, Alloy 가 중앙 Tempo 로 전달한다.
# 컨테이너는 --network host 로 떠서 127.0.0.1 이 호스트의 Alloy 다.
management:
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${POUDY_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: staging
    tracing:
      export:
        otlp:
          endpoint: ${POUDY_TRACING_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

jdbc:
  datasource-proxy:
    enabled: true
