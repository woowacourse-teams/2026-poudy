# 운영 배포용 프로필. SPRING_PROFILES_ACTIVE=prod 로 활성화한다.

# 배포 전에 S3에서 JSON을 내려받아 이 디렉터리에 저장한다.
poudy:
  data-dir: ${POUDY_DATA_DIR:/app/data}
  # 운영은 nginx 가 같은 오리진에서 /api 를 프록시하므로 CORS 가 필요 없다.
  # 다른 도메인에서 부를 일이 생기면 CLIENT_DOMAIN 으로 넣는다.
  cors:
    allowed-origins: ${CLIENT_DOMAIN:}
  feedback:
    image-reconciliation:
      enabled: true

# 같은 인스턴스의 nginx가 전달한 X-Forwarded-For를 원격 주소로 복원해 요청 제한에 사용한다.
server:
  forward-headers-strategy: native

# API 문서 엔드포인트를 끈다. 켜둔 채로 배포하면 /swagger-ui.html 과
# /v3/api-docs 가 그대로 공개된다. springdoc 도 기동 로그로 같은 경고를 남긴다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
