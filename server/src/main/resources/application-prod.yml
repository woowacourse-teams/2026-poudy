# 운영 배포용 프로필. SPRING_PROFILES_ACTIVE=prod 로 활성화한다.

spring:
  datasource:
    url: ${POUDY_DB_URL}
    username: ${POUDY_DB_USERNAME}
    password: ${POUDY_DB_PASSWORD}
    hikari:
      # API·배치 연결의 SQL 실행 상한. 정상 실행 시간을 측정한 밀리초 값을 환경별로 제공한다.
      connection-init-sql: "SET statement_timeout = '${POUDY_DB_STATEMENT_TIMEOUT_MS}'"
  # Flyway는 API·배치 풀의 짧은 상한을 상속하지 않는 별도 연결을 사용한다.
  flyway:
    url: ${POUDY_DB_URL}
    user: ${POUDY_DB_USERNAME}
    password: ${POUDY_DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

poudy:
  # 운영은 nginx 가 같은 오리진에서 /api 를 프록시하므로 CORS 가 필요 없다.
  # 다른 도메인에서 부를 일이 생기면 CLIENT_DOMAIN 으로 넣는다.
  cors:
    allowed-origins: ${CLIENT_DOMAIN:}
  feedback:
    image-transfer:
      enabled: true
    retention:
      enabled: true
  member:
    retention:
      enabled: true

# 같은 인스턴스의 nginx가 전달한 X-Forwarded-For를 원격 주소로 복원해 요청 제한에 사용한다.
server:
  forward-headers-strategy: native

# 모니터링 에이전트가 로컬에서만 접근하도록 Actuator 전용 포트를 분리한다.
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# API 문서 엔드포인트를 끈다. 켜둔 채로 배포하면 /swagger-ui.html 과
# /v3/api-docs 가 그대로 공개된다. springdoc 도 기동 로그로 같은 경고를 남긴다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
