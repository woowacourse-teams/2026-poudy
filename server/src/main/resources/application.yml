spring:
  application:
    name: poudy
  # 프로필을 지정하지 않고 실행하면 로컬 개발용 dev 로 뜬다.
  # 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
  profiles:
    default: dev
  # 배포 중 인스턴스가 교체될 때 처리 중이던 요청을 끊지 않는다.
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # 응답 필드를 DTO 선언 순서 그대로 문서에 싣는다. 사전순으로 정렬하면
  # children 같은 필드가 앞으로 올라와 실제 응답과 읽는 순서가 어긋난다.
  writer-with-order-by-keys: false
  # produces 를 적지 않으면 문서에 */* 로 올라가, 생성된 타입도 content['*/*'] 가 된다.
  default-produces-media-type: application/json
  # @ModelAttribute 로 묶은 쿼리 파라미터를 개별 파라미터로 편다. 안 펴면 문서가 실제 요청과 어긋난다.
  default-flat-param-object: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
