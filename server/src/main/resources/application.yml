spring:
  application:
    name: poudy
  # 로컬 값은 server/.env 에서 읽는다. 예시는 server/.env.example 에 있다.
  # 실행 위치가 server 인지 레포 루트인지에 따라 상대 경로가 달라지므로 둘 다 본다.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./server/.env[.properties]
  # 프로필을 지정하지 않고 실행하면 로컬 개발용 dev 로 뜬다.
  # 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  # 배포 중 인스턴스가 교체될 때 처리 중이던 요청을 끊지 않는다.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # 스키마는 서버가 기동할 때 Flyway 가 db/migration 의 버전 순서로 적용한다.
  # Flyway 도입 전부터 운영하던 DB 는 첫 기동에 V2 까지 적용된 것으로 baseline 을 등록한다.
  # 이력이 없는 DB 에서만 동작하므로, 새 환경의 DB 는 첫 배포 전에 스키마가 V2 와 같은지 확인한다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
  datasource:
    url: ${POUDY_DB_URL:jdbc:postgresql://localhost:5432/poudy}
    username: ${POUDY_DB_USERNAME:${USER:postgres}}
    password: ${POUDY_DB_PASSWORD:}
  # 소셜 로그인. 운영 nginx 는 /api 만 백엔드로 넘기므로 콜백도 /api 아래에 둔다.
  # 키가 없어도 서버는 뜨고 로그인만 실패한다. 운영 프로필은 값이 없으면 뜨지 않는다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:unset}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope: account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope: openid, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  shutdown: graceful
  # 세션은 서버 메모리에 있다. 운영 프로필은 종료할 때 파일에 남기고 다시 뜰 때 불러온다(application-prod.yml).
  # 쿠키 수명은 앱 세션에 맞춘 전역 값이고, 웹 세션의 짧은 수명은 poudy.auth.web-session 이 판정한다.
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 60d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # 응답 필드를 DTO 선언 순서 그대로 문서에 싣는다. 사전순으로 정렬하면
  # children 같은 필드가 앞으로 올라와 실제 응답과 읽는 순서가 어긋난다.
  writer-with-order-by-keys: false
  # produces 를 적지 않으면 문서에 */* 로 올라가, 생성된 타입도 content['*/*'] 가 된다.
  default-produces-media-type: application/json
  # @ModelAttribute 로 묶은 쿼리 파라미터를 개별 파라미터로 편다. 안 펴면 문서가 실제 요청과 어긋난다.
  default-flat-param-object: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# CORS 를 열어 줄 클라이언트 도메인. 값은 .env 나 환경 변수가 갖는다.
# 쉼표로 여럿을 적을 수 있고, 비워 두면 CORS 를 아예 열지 않는다.
poudy:
  auth:
    web-session:
      idle-timeout: P1D
      absolute-timeout: P7D
    admin-session:
      idle-timeout: PT1H
      absolute-timeout: PT12H
    app-session:
      idle-timeout: P60D
    app-login:
      kakao-app-id: "1595861"
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CLIENT_DOMAIN:}
  feedback:
    image-s3:
      bucket: ${POUDY_FEEDBACK_S3_BUCKET:}
      pending-prefix: ${POUDY_FEEDBACK_S3_PENDING_PREFIX}
      region: ${AWS_REGION:ap-northeast-2}
    discord:
      webhook-url: ${POUDY_DISCORD_FEEDBACK_WEBHOOK_URL:}
    rate-limit:
      max-requests: 5
      window: PT1H
    image-upload-rate-limit:
      max-requests: 5
      window: PT1H
    image-processing:
      max-concurrency: 1
    image-transfer:
      enabled: false
      interval: PT5M
      initial-delay: PT1M
    retention:
      enabled: false
      max-age: P83D
      batch-size: 500
      max-batches: 20
      cron: "0 30 3 * * *"
  member:
    retention:
      enabled: false
      max-age: P30D
      cron: "0 40 3 * * *"
  product-request:
    discord:
      webhook-url: ${PRODUCT_REQUEST_DISCORD_WEBHOOK_URL:}
    rate-limit:
      max-requests: 5
      window: PT1H
