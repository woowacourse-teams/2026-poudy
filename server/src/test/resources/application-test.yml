# 테스트와 OpenAPI 생성은 개발 DB 와 분리된 poudy_test 를 쓴다.
# 컨텍스트가 뜰 때마다 스키마를 비우고 운영 스키마와 테스트 데이터를 다시 넣는다.
poudy:
  feedback:
    image-s3:
      pending-prefix: poudy/test/feedback/pending/

spring:
  datasource:
    url: ${POUDY_TEST_DB_URL:jdbc:postgresql://localhost:5432/poudy_test}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-reset.sql,classpath:db/schema.sql,classpath:db/search.sql
      data-locations: classpath:db/test-data.sql
      # 스키마에 PL/pgSQL 함수($$ 본문 안의 ;)가 있어 문장 단위로 쪼개지 않고 파일 하나를 통째로 실행한다.
      # 한 번에 보낸 문장 묶음은 한 트랜잭션으로 실행되므로 커밋 시점 검사 트리거도 파일 끝에서 한 번 돈다.
      separator: "^^^ END OF SCRIPT ^^^"
