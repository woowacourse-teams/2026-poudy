# 테스트와 OpenAPI 생성은 개발 DB 와 분리된 poudy_test 를 쓴다.
# 컨텍스트가 뜰 때마다 스키마를 비우고 운영과 같은 마이그레이션을 적용한 뒤 db/callback 의 테스트 데이터를 넣는다.
poudy:
  auth:
    admin-session:
      store-file: ""
  notice:
    image-s3:
      prefix: poudy/test/notices/
  image:
    s3:
      bucket: poudy-test-bucket
      feedback-prefix: poudy/test/feedback/images/
      profile-prefix: poudy/test/users/profile/
  # 로컬 .env 의 값과 무관하게 모든 테스트가 같은 값으로 뜨게 고정해, 이 값만 다르던 테스트도 기본 컨텍스트를 같이 쓴다.
  admin:
    username: admin-test
    password-hash: "$2a$10$HiIu.Bhtz5V3lguUE38YZei4ONOGoLHp6R/SKBLfHCVxI7y02LsmW"
  cors:
    allowed-origins: ""

spring:
  datasource:
    url: ${POUDY_TEST_DB_URL:jdbc:postgresql://localhost:5432/poudy_test}
    # 테스트 DB 는 작아 JIT 이득이 없고, 검색 함수마다 JIT 컴파일이 붙어 CI 의 postgres:18 에서 쿼리 하나가 1초 넘게 걸린다.
    hikari:
      data-source-properties:
        options: -c jit=off
      # 테스트는 설정이 다른 컨텍스트를 캐시에 남겨 둔다. 기본값이면 컨텍스트마다 연결 10개를 늘 열어 두어
      # 컨텍스트 10개로 PostgreSQL 기본 한도 100개를 채우고, 개발 서버를 함께 띄우면 too many clients 로 실패한다.
      # 쓰지 않는 연결은 10초(Hikari 최솟값, 밀리초로 적는다) 뒤 닫는다. 풀 크기는 8개 스레드로 동시에 쓰는 테스트가 있어 그대로 둔다.
      minimum-idle: 0
      idle-timeout: 10000
  flyway:
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/callback
