# PR 의 변경 경로를 보고 영역 레이블을 붙인다. 레이블이 없으면 액션이 실패한다.
#
# 영역을 바꿀 때는 세 곳을 함께 고친다. 한 곳만 고치면 조용히 무시된다.
#   이 파일 / ISSUE_TEMPLATE 의 영역 드롭다운 / issue-area-label.yml 의 areas

server:
  - changed-files:
      - any-glob-to-any-file: ['server/**']

client:
  - changed-files:
      - any-glob-to-any-file: ['client/**']

common:
  - changed-files:
      - any-glob-to-any-file: ['common/**']

# 워크플로와 저장소 설정. 루트 Git 설정만 고친 PR 도 레이블을 받게 한다.
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.githooks/**'
          - '.gitattributes'
          - '.gitignore'
          - '.gitmessage.txt'
          - 'setup-git.sh'

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']
