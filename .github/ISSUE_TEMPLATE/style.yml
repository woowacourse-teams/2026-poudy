      required: true

  - type: textarea
    id: target
    attributes:
      label: 대상
      description: 어떤 코드를 정리하나요.
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 정리 내용
      value: |
        -
    validations:
      required: true
