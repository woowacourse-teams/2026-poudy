name: Deploy scripts CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-ci.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-ci.yml'

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check frontend and container deployment shell syntax
        run: |
          for script_file in deploy/codedeploy/frontend/scripts/*.sh deploy/codedeploy/backend-container/scripts/*.sh; do
            bash -n "$script_file"
          done
      - name: Check deployment observer Python syntax
        run: |
          python3 -m py_compile deploy/monitoring/deployment/collector.py deploy/monitoring/deployment/configure.py
          python3 -c "import json; json.load(open('deploy/monitoring/deployment/config.json'))"
      - name: Test deployment scripts
        run: |
          for test_file in deploy/tests/*.test.py; do
            python3 "$test_file"
          done
      - name: Test sitemap content verification
        run: node --test deploy/tests/*.test.mjs
