name: Client CI

# dev 로 가는 PR 은 클라이언트가 바뀔 때만, main 으로 가는 릴리스 PR 은 항상 검사한다.
# common/ 변경만 있는 dev 대상 PR은 client-common-ci.yaml이 Lighthouse 없이 검사한다.
# 워크플로 수준 paths 로는 대상 브랜치마다 조건을 달리할 수 없어, changes 가 판단한다.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  # 클라이언트와 관련된 변경이 있는지만 판단한다. 이 잡은 항상 돈다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/client-ci.yaml'

  # 검사를 건너뛰면 결과 artifact 가 없다. 댓글 워크플로는 이때 댓글을 달지 않는다.
  check:
    name: Client checks
    needs: changes
    if: github.base_ref == 'main' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      # setup-node 의 pnpm cache가 store 경로를 찾을 수 있도록 pnpm을 먼저 설치한다.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Format
        id: format
        continue-on-error: true
        run: pnpm run format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm run test

      # preview 를 만들지 못하면 Lighthouse 를 잴 수 없다. 목으로는 빌드 중 API
      # 요청을 받을 수 없어 대신 잴 수단도 없다. 조용히 건너뛰면 점수가 빠진
      # 것을 알아채기 어려우므로 여기서 바로 멈춘다.
      #
      # fork 에서 온 PR 은 secret 을 읽지 못해 항상 이 자리에서 실패한다.
      - name: Check preview secrets
        run: |
          missing=""
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "${{ secrets.VERCEL_ORG_ID }}" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] || missing="$missing VERCEL_PROJECT_ID"
          [ -n "${{ vars.STAGING_API_BASE_URL }}" ] || missing="$missing STAGING_API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::다음 값이 비어 있어 preview 를 만들 수 없습니다:$missing"
            exit 1
          fi

      # preview 로 올려 그 주소를 잰다. 빌드는 vercel 이 한 번만 하고, 타입 검사는
      # 앞의 Type check 단계가 이미 맡으므로 여기서 따로 빌드하지 않는다.
      #
      # 미리 만드는 화면은 빌드하며 API 를 부르므로 주소를 준다. 목으로는 이 요청을
      # 받을 수 없어, 목을 켠 빌드를 재면 데이터가 빈 화면을 재게 된다.
      #
      # Vercel 명령은 저장소 루트에서 실행한다. 공유 API 스키마(common/)를 client 가 불러오므로
      # 빌드가 client/ 밖을 읽어야 한다. Vercel 프로젝트의 Root Directory 를 client 로 두고
      # 루트에서 실행해야, 산출물 경로가 client/client 처럼 겹치지 않는다.
      - name: Build preview
        id: build
        continue-on-error: true
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # preview 는 공개 주소다. production 으로 두면 색인을 허용하고 GA 로
          # 실제 이벤트를 보내므로, 운영과 같은 내용이 검색 순위를 나눠 갖는다.
          NEXT_PUBLIC_ENVIRONMENT: staging
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          # 이 값이 없으면 metadataBase 가 빈 주소가 되어 빌드가 멈춘다. preview 는
          # 배포 뒤 PR 번호로 정해지는 고정 주소를 붙이므로 그 주소를 미리 쓴다.
          NEXT_PUBLIC_SITE_URL: https://pr-${{ github.event.pull_request.number }}.preview.poudy.site
        run: |
          pnpm add --global vercel
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # 배포마다 vercel.app 주소가 달라지므로, 배포 뒤 PR 번호로 정해지는
      # pr-<번호>.preview.poudy.site 를 붙여 뒤 단계로 넘긴다. vercel.app 은 API
      # (staging.poudy.site)와 다른 사이트라 세션 쿠키가 실리지 않지만, 이 주소는
      # 같은 사이트라 로그인을 확인할 수 있다. 같은 PR 에 다시 배포하면 별칭이 새
      # 배포로 옮겨 가고, PR 이 닫히면 client-preview-cleanup.yaml 이 뗀다.
      # 인증서는 Vercel 프로젝트의 *.preview.poudy.site 와일드카드가 맡는다.
      - name: Deploy preview
        id: preview
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.preview.poudy.site
        run: |
          deployment=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          vercel alias set "$deployment" "$PREVIEW_HOST" --token=${{ secrets.VERCEL_TOKEN }}
          url="https://$PREVIEW_HOST"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### preview 배포" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "배포 주소: $deployment" >> "$GITHUB_STEP_SUMMARY"

      # Chrome 은 ubuntu-latest 에 이미 설치되어 있어 따로 준비하지 않는다.
      #
      # preview 는 staging 이라 색인을 막는다. 그래서 is-crawlable 은 언제나
      # 실패하고 SEO 점수만 31% 깎는다. 회귀를 잡아 주지 못하므로 빼고 잰다.
      # 운영의 색인 상태는 client-production-seo.yaml 이 따로 확인한다.
      #
      # 설정은 client/lighthouserc.json 에 있다.
      # 여러 번 재기와 중간값 고르기는 lhci 가 맡는다.
      # 이미 떠 있는 주소를 재므로 여기서 서버를 띄우지 않는다.
      - name: Lighthouse
        id: lighthouse
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm dlx @lhci/cli@0.15.1 autorun \
            --collect.url="${{ steps.preview.outputs.url }}"

      # 뒤 단계가 읽는 자리로 중간값 보고서를 옮긴다.
      - name: Collect Lighthouse median report
        id: median
        if: steps.lighthouse.outcome == 'success'
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const manifest = JSON.parse(
            fs.readFileSync('./.lighthouseci-report/manifest.json', 'utf8'),
          );

          // lhci 가 여러 실행 중 대표로 고른 것이 중간값 실행이다.
          const median = manifest.find((entry) => entry.isRepresentativeRun);
          if (!median) {
            throw new Error('중간값으로 뽑힌 Lighthouse 실행이 없습니다.');
          }

          const percent = (value) =>
            typeof value === 'number' ? Math.round(value * 100) : null;

          // 실행 순서대로 둔다. manifest 는 중간값을 마지막에 쓰므로 정렬이 흐트러져 있다.
          const runs = manifest
            .map((entry) => ({
              performance: percent(entry.summary.performance),
              accessibility: percent(entry.summary.accessibility),
              bestPractices: percent(entry.summary['best-practices']),
              seo: percent(entry.summary.seo),
              median: entry === median,
            }))
            .sort((a, b) => a.performance - b.performance);

          console.log(
            `Performance ${runs.map((run) => run.performance).join(' / ')} → 중간값 ${percent(median.summary.performance)}`,
          );

          fs.writeFileSync('lighthouse-runs.json', JSON.stringify(runs));
          fs.copyFileSync(median.jsonPath, './lighthouse-report.json');
          NODE

      - name: Save check results
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const results = {
            format: '${{ steps.format.outcome }}',
            lint: '${{ steps.lint.outcome }}',
            typecheck: '${{ steps.typecheck.outcome }}',
            test: '${{ steps.test.outcome }}',
            build: '${{ steps.build.outcome }}',
            preview: '${{ steps.preview.outcome }}',
            lighthouse: '${{ steps.lighthouse.outcome }}',
            // 어느 주소를 잰 점수인지 함께 남긴다.
            lighthouseUrl: '${{ steps.preview.outputs.url }}' || null,
          };

          if (fs.existsSync('lighthouse-report.json')) {
            try {
              const report = JSON.parse(
                fs.readFileSync('lighthouse-report.json', 'utf8'),
              );
              const score = (key) => {
                const value = report.categories?.[key]?.score;
                return typeof value === 'number' ? Math.round(value * 100) : null;
              };

              results.lighthouseScores = {
                performance: score('performance'),
                accessibility: score('accessibility'),
                bestPractices: score('best-practices'),
                seo: score('seo'),
              };
            } catch {
              results.lighthouseScores = null;
            }
          } else {
            results.lighthouseScores = null;
          }

          // 회차별 점수는 편차를 보여 주는 용도라 없어도 나머지 결과는 그대로 쓴다.
          if (fs.existsSync('lighthouse-runs.json')) {
            try {
              results.lighthouseRuns = JSON.parse(
                fs.readFileSync('lighthouse-runs.json', 'utf8'),
              );
            } catch {
              results.lighthouseRuns = null;
            }
          } else {
            results.lighthouseRuns = null;
          }

          fs.writeFileSync('client-ci-results.json', JSON.stringify(results));
          NODE

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-ci-results
          path: |
            client/client-ci-results.json
            client/lighthouse-report.json
            client/lighthouse-runs.json
            client/.lighthouseci-report/
          if-no-files-found: error

      - name: Fail if any check failed
        if: steps.format.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure' || steps.preview.outcome == 'failure' || steps.lighthouse.outcome == 'failure' || steps.median.outcome == 'failure'
        run: exit 1
