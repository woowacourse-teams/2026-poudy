name: Mobile CI

on:
  pull_request:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 검증 산출물은 배포하지 않으므로 실제 서비스 주소 대신 예약 도메인을 사용한다.
      EXPO_PUBLIC_SERVICE_URL: https://example.invalid
      EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
      # 로그인은 실행하지 않으며, Expo 설정 검증에 필요한 형식만 맞춘다.
      EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY: "00000000000000000000000000000000"
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "1234567890-ci.apps.googleusercontent.com"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # 실제 파일은 Git 에 올리지 않고 EAS 파일 변수로 넘기므로, prebuild 가 복사할 형식만 맞춘 파일을 쓴다.
      - name: Write placeholder FCM config
        run: |
          file="$RUNNER_TEMP/google-services.json"
          cat > "$file" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "poudy-ci",
              "storage_bucket": "poudy-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.poudy.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "GOOGLE_SERVICES_JSON=$file" >> "$GITHUB_ENV"

      - name: Generate native projects
        run: pnpm exec expo prebuild --clean --no-install

      - name: Export bundles
        run: pnpm exec expo export --platform all --output-dir "$RUNNER_TEMP/mobile-export"
