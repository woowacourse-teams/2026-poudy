name: Commit Lint

# commit-msg 훅은 로컬 장치라 --no-verify 나 훅 미설치로 우회된다.
# PR 에 올라온 커밋을 같은 규칙으로 다시 검사한다.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 훅 스크립트를 그대로 재사용해 규칙이 두 곳으로 갈라지지 않게 한다.
      - name: Validate commit messages
        env:
          # 훅 위치를 옮기면 이 값도 함께 고쳐야 한다.
          HOOK_PATH: .githooks/commit-msg
        run: |
          # HEAD 는 refs/pull/N/merge 다. 첫 부모가 현재 베이스 tip, 둘째가 PR head 다.
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "::error::PR 머지 커밋을 찾을 수 없습니다. actions/checkout 설정을 확인하세요."
            exit 1
          fi

          # 검사 범위는 PR 이 더한 커밋뿐이다. 페이로드의 base.sha 를 쓰면 이벤트 이후
          # 베이스에 머지된 남의 커밋이 범위에 섞여, 재실행 때 엉뚱한 커밋으로 실패한다.
          base=$(git merge-base HEAD^1 HEAD^2)
          failed=0
          message=$(mktemp)

          # 훅은 베이스 브랜치 버전을 쓴다. 체크아웃된 PR 쪽 훅을 실행하면
          # 훅을 무력화한 PR 이 자기 자신을 통과시킬 수 있다.
          if ! git cat-file -e "HEAD^1:$HOOK_PATH" 2>/dev/null; then
            echo "::error::베이스 브랜치에서 $HOOK_PATH 를 찾을 수 없습니다. 훅 위치가 바뀌었다면 이 워크플로의 HOOK_PATH 도 함께 고치세요."
            exit 1
          fi

          hook=$(mktemp)
          git show "HEAD^1:$HOOK_PATH" > "$hook"
          chmod +x "$hook"

          for sha in $(git rev-list --no-merges "$base..HEAD^2"); do
            git log -1 --format=%B "$sha" > "$message"
            if ! "$hook" "$message"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "커밋 메시지 규칙은 AGENTS.md 를 참고하세요."
            exit 1
          fi

          echo "모든 커밋 메시지가 규칙에 맞습니다."
