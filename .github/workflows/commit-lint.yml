name: Commit Lint

# commit-msg 훅은 로컬 장치라 --no-verify 나 훅 미설치로 우회된다.
# PR 에 올라온 커밋을 같은 규칙으로 다시 검사한다.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 훅 스크립트를 그대로 재사용해 규칙이 두 곳으로 갈라지지 않게 한다.
      - name: Validate commit messages
        env:
          # 훅 위치를 옮기면 이 값도 함께 고쳐야 한다.
          HOOK_PATH: .githooks/commit-msg
        run: |
          # HEAD 는 refs/pull/N/merge 다. 첫 부모가 현재 베이스 tip, 둘째가 PR head 다.
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "::error::PR 머지 커밋을 찾을 수 없습니다. actions/checkout 설정을 확인하세요."
            exit 1
          fi

          # 검사 범위는 PR 이 더한 커밋뿐이다. 페이로드의 base.sha 를 쓰면 이벤트 이후
          # 베이스에 머지된 남의 커밋이 범위에 섞여, 재실행 때 엉뚱한 커밋으로 실패한다.
          base=$(git merge-base HEAD^1 HEAD^2)
          failed=0
          message=$(mktemp)

          # 훅은 베이스 브랜치 버전을 쓴다. 체크아웃된 PR 쪽 훅을 실행하면
          # 훅을 무력화한 PR 이 자기 자신을 통과시킬 수 있다.
          if ! git cat-file -e "HEAD^1:$HOOK_PATH" 2>/dev/null; then
            echo "::error::베이스 브랜치에서 $HOOK_PATH 를 찾을 수 없습니다. 훅 위치가 바뀌었다면 이 워크플로의 HOOK_PATH 도 함께 고치세요."
            exit 1
          fi

          hook=$(mktemp)
          git show "HEAD^1:$HOOK_PATH" > "$hook"
          chmod +x "$hook"

          for sha in $(git rev-list --no-merges "$base..HEAD^2"); do
            git log -1 --format=%B "$sha" > "$message"
            if ! "$hook" "$message"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "커밋 메시지 규칙은 CONTRIBUTING.md 를 참고하세요."
            exit 1
          fi

          echo "모든 커밋 메시지가 규칙에 맞습니다."

      # 위 검사는 베이스 훅을 쓰므로 이 PR 이 훅을 고쳐도 그 변경은 실행되지 않는다.
      # 훅 자체가 의도대로 동작하는지는 체크아웃된 버전으로 따로 확인한다.
      - name: Test the hook in this pull request
        env:
          HOOK_PATH: .githooks/commit-msg
        run: |
          hook="./$HOOK_PATH"
          chmod +x "$hook"
          message=$(mktemp)
          failed=0

          # 통과해야 하는 메시지는 0, 막아야 하는 메시지는 1 을 기대한다.
          expect() {
            expected=$1
            name=$2
            if "$hook" "$message" >/dev/null 2>&1; then
              actual=0
            else
              actual=1
            fi
            if [ "$actual" -ne "$expected" ]; then
              echo "::error::훅 테스트 실패: $name (기대 $expected, 실제 $actual)"
              failed=1
            fi
          }

          for type in build ci docs feat fix perf refactor test; do
            printf '%s : 제목만 있는 커밋\n' "$type" > "$message"
            expect 0 "$type 타입"
          done

          for type in style rename remove; do
            printf '%s : 더 이상 허용하지 않는 타입\n' "$type" > "$message"
            expect 1 "$type 타입 거부"
          done

          printf 'feat : 실제 줄바꿈 본문\n\n- 첫째 줄\n- 둘째 줄\n' > "$message"
          expect 0 "실제 줄바꿈 본문"

          # 작은따옴표라 셸이 해석하지 않는다. 파일에 역슬래시와 n 두 글자가 그대로 들어간다.
          printf 'feat : 이스케이프 본문\n\n- 첫째 줄\\n- 둘째 줄\n' > "$message"
          expect 1 "개행 이스케이프 문자열"

          printf 'feat : 제목 안 이스케이프\\n붙음\n' > "$message"
          expect 1 "제목 안 개행 이스케이프"

          printf '제목에 타입이 없다\n' > "$message"
          expect 1 "타입 없는 제목"

          printf 'feat : 이모지 금지 \360\237\216\211\n' > "$message"
          expect 1 "제목 이모지"

          printf 'feat : 제목\n본문이 붙어 있다\n' > "$message"
          expect 1 "제목과 본문 사이 빈 줄 없음"

          printf 'feat : 제목\n\n본문\n\nCo-authored-by: someone <a@b.c>\n' > "$message"
          expect 1 "공동 작성자 트레일러"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "훅이 모든 테스트를 통과했습니다."
