name: Client Staging Deploy

on:
  push:
    branches: [dev]
    paths:
      - "client/**"
      - "common/**"
      - ".github/workflows/client-staging-deploy.yaml"

permissions:
  contents: read

# 연달아 머지되면 마지막 것만 올린다. 앞선 배포를 기다렸다 덮어쓰지 않는다.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      # setup-node 의 pnpm cache가 store 경로를 찾을 수 있도록 pnpm을 먼저 설치한다.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # 값이 없으면 목을 켠 채로 배포되거나 빈 주소로 요청이 나간다. 먼저 막는다.
      - name: Check required settings
        run: |
          missing=""
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "${{ secrets.VERCEL_ORG_ID }}" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] || missing="$missing VERCEL_PROJECT_ID"
          [ -n "${{ vars.STAGING_API_BASE_URL }}" ] || missing="$missing STAGING_API_BASE_URL"
          [ -n "${{ vars.STAGING_SITE_URL }}" ] || missing="$missing STAGING_SITE_URL"
          # 키가 없으면 분석 이벤트를 조용히 버린다. 배포는 성공해 알아채기 어렵다.
          [ -n "${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" ] || missing="$missing NEXT_PUBLIC_POSTHOG_KEY"
          if [ -n "$missing" ]; then
            echo "::error::다음 secret 이 비어 있습니다:$missing"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 배포 도구는 플랫폼을 따라가야 하므로 버전을 묶지 않는다.
      - name: Install Vercel CLI
        run: pnpm add --global vercel

      # staging 주소를 고정하려고 이 프로젝트의 production 으로 올린다.
      # preview 로 올리면 배포마다 주소가 바뀌어 서버 CORS 에 등록할 수 없다.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          # staging 은 목이 아니라 실제 API 를 본다.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          NEXT_PUBLIC_ENVIRONMENT: staging
          NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### staging 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
