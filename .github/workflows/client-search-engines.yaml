name: Client Search Engines

# 운영 사이트맵에서 새로 생기거나 lastmod 가 바뀐 URL 을 검색 엔진에 알린다.
#
# - 네이버: IndexNow 로 바뀐 URL 을 보낸다. IndexNow 에 참여하는 엔진(Bing 등)은 받은 URL 을 서로
#   나눠 가지므로 네이버에만 보낸다. 키 파일은 client/public/<키>.txt 다.
# - 구글: IndexNow 를 받지 않고 사이트맵 ping 도 없앴다. Search Console API 로 바뀐 URL 이 든
#   하위 사이트맵을 다시 제출한다. 서비스 계정을 sc-domain:poudy.site 속성에 전체 권한 사용자로
#   추가하고, 그 키를 GOOGLE_SEARCH_CONSOLE_CREDENTIALS 시크릿에 둔다. 없으면 구글만 건너뛴다.
#
# 무엇이 바뀌었는지는 지난 실행 때 본 사이트맵(URL 과 lastmod)을 캐시에 두고 견줘 고른다.
# lastmod 날짜로 고르지 않는다. 화면 기준일은 라벨을 단 날이라 머지가 늦으면 지난 날짜로 나간다.
# 보내기에 실패하면 기록을 남기지 않아 다음 실행에서 다시 보낸다. 기록이 없으면 전부 보낸다.
#
# 키 파일이 운영에 아직 배포되지 않았으면 네이버에는 보내지 않고 기록도 남기지 않는다.
# schedule 은 기본 브랜치(dev)에서 돌므로 키를 바꾸면 main 에 나갈 때까지 네이버에 보내지 않는다.
on:
  # 매일 10:00 KST. 운영 nginx 가 사이트맵을 하루 캐시하므로 하루 한 번이면 된다.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  # 스크립트를 고친 PR 에서는 테스트와 시험 실행만 한다.
  pull_request:
    paths:
      - ".github/scripts/notify-search-engines*"
      - ".github/workflows/client-search-engines.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify changed URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNAPSHOT: search-engines-snapshot.json
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Check site url
        run: |
          if [ -z "${{ vars.PRODUCTION_SITE_URL }}" ]; then
            echo "::error::PRODUCTION_SITE_URL 이 비어 있어 운영 주소를 알 수 없습니다."
            exit 1
          fi

      - name: Test
        run: node --test .github/scripts/notify-search-engines.test.mjs

      - name: Restore snapshot
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SNAPSHOT }}
          key: search-engines-snapshot-${{ github.run_id }}
          restore-keys: search-engines-snapshot-

      - name: Google auth
        id: google
        if: github.event_name != 'pull_request' && env.HAS_GOOGLE_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters

      - name: Notify
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node .github/scripts/notify-search-engines.mjs

      # 기록이 없던 실행이 키 파일이 없어 건너뛰면 남길 기록도 없다.
      - name: Save snapshot
        if: github.event_name != 'pull_request' && hashFiles(env.SNAPSHOT) != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SNAPSHOT }}
          key: search-engines-snapshot-${{ github.run_id }}
