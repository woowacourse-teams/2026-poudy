name: Client Production SEO

# 운영 화면의 SEO 를 잰다.
#
# PR 검사는 preview 를 재는데, preview 는 staging 이라 색인이 막혀 있다.
# 그래서 운영에서 색인이 실제로 열려 있는지는 그곳에서 확인할 수 없다.
# 이 워크플로가 그 자리를 메운다.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # 배포가 늦어져 옛 화면을 잰 것 같을 때 손으로 다시 돌린다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure production SEO
    # 머지되지 않고 닫힌 PR 은 배포로 이어지지 않는다.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check site url
        run: |
          if [ -z "${{ vars.PRODUCTION_SITE_URL }}" ]; then
            echo "::error::PRODUCTION_SITE_URL 이 비어 있어 운영 주소를 알 수 없습니다."
            exit 1
          fi

      # 운영은 이미 배포되어 있으므로 빌드하지 않고 주소만 잰다.
      # 다만 배포는 CodePipeline 이 맡으므로 머지 직후에는 아직 옛 화면이다.
      # 배포가 끝날 만큼 기다린 뒤 잰다.
      #
      # 배포 완료를 확인하고 기다리는 것이 아니라 정해진 시간만 센다. 운영은
      # 배포 전에도 200 을 주고 화면에 버전을 드러내지 않아, 밖에서는 새 배포인지
      # 가릴 수 없기 때문이다. 배포가 이보다 늦어지면 옛 화면을 잰 값이 나오므로,
      # 그럴 때는 workflow_dispatch 로 다시 돌린다.
      - name: Wait for deployment
        if: github.event_name == 'pull_request'
        run: sleep 600

      # 색인 상태를 확인하는 것이 목적이므로 is-crawlable 을 빼지 않는다.
      - name: Lighthouse
        id: lighthouse
        run: |
          npx --yes @lhci/cli@0.15.1 autorun \
            --collect.url="${{ vars.PRODUCTION_SITE_URL }}" \
            --collect.numberOfRuns=3 \
            --collect.settings.chromeFlags="--headless --no-sandbox --disable-dev-shm-usage" \
            --upload.target=filesystem \
            --upload.outputDir=./.lighthouseci-report

      - name: Summarize
        if: steps.lighthouse.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const manifest = JSON.parse(
            fs.readFileSync('./.lighthouseci-report/manifest.json', 'utf8'),
          );

          const median = manifest.find((entry) => entry.isRepresentativeRun);
          if (!median) throw new Error('중간값으로 뽑힌 Lighthouse 실행이 없습니다.');

          const report = JSON.parse(fs.readFileSync(median.jsonPath, 'utf8'));
          const percent = (value) =>
            typeof value === 'number' ? Math.round(value * 100) : null;

          // 색인이 막히면 검색에 아예 안 나오므로 결과에서 가장 먼저 보이게 둔다.
          const crawlable = report.audits['is-crawlable'];
          const indexable = crawlable?.score === 1;

          const lines = [
            '### 운영 SEO 측정',
            '',
            `측정 대상: ${'${{ vars.PRODUCTION_SITE_URL }}'}`,
            '',
            `색인 허용: ${indexable ? '✅ 열려 있음' : '❌ 막혀 있음'}`,
            '',
            '| 검사 항목 | 점수 |',
            '| --- | --- |',
            `| SEO | ${percent(median.summary.seo)} |`,
            `| Performance | ${percent(median.summary.performance)} |`,
            `| Accessibility | ${percent(median.summary.accessibility)} |`,
            `| Best Practices | ${percent(median.summary['best-practices'])} |`,
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');

          // Discord 는 표 문법을 렌더링하지 않는다. 점수는 embed field 로 세운다.
          const mark = (score) => (score >= 90 ? '🟢' : score >= 50 ? '🟡' : '🔴');
          const field = (name, score) => ({ name, value: `${mark(score)} ${score}`, inline: true });
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          fs.writeFileSync(
            'discord-payload.json',
            JSON.stringify({
              embeds: [
                {
                  title: indexable ? '🔍 운영 SEO 측정' : '❌ 운영 화면이 색인에서 막혔습니다',
                  url: '${{ vars.PRODUCTION_SITE_URL }}',
                  // 색인이 막힌 것은 사고이므로 붉게, 정상이면 초록으로 둔다.
                  color: indexable ? 5763719 : 15548997,
                  description: `색인 허용: ${indexable ? '✅ 열려 있음' : '❌ 막혀 있음'}\n[실행 기록 보기](${runUrl})`,
                  fields: [
                    field('SEO', percent(median.summary.seo)),
                    field('Performance', percent(median.summary.performance)),
                    field('Accessibility', percent(median.summary.accessibility)),
                    field('Best Practices', percent(median.summary['best-practices'])),
                  ],
                  footer: { text: process.env.GITHUB_REPOSITORY },
                  timestamp: new Date().toISOString(),
                },
              ],
            }),
          );

          if (!indexable) {
            console.log('::error::운영 화면이 색인에서 막혀 있습니다.');
            process.exit(1);
          }
          NODE

      # 색인이 막히면 앞 단계가 실패하므로 always 로 둔다. 그 경우가 오히려
      # 가장 알려야 하는 상황이다. Webhook 이 없으면 알림만 건너뛴다.
      - name: Notify Discord
        if: always() && hashFiles('discord-payload.json') != ''
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_PRODUCTION }}" ]; then
            echo "::notice::Discord Webhook 이 없어 알림을 건너뜁니다."
            exit 0
          fi
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data @discord-payload.json \
            "${{ secrets.DISCORD_WEBHOOK_PRODUCTION }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-seo-report
          path: ./.lighthouseci-report/
          if-no-files-found: ignore
