name: Server CI

# dev 도 감시한다. PR 이 각각 통과해도 머지 결과는 다를 수 있다.
# 워크플로 수준 paths 는 쓰지 않는다. 실행 자체가 안 되면 필수 체크가
# Expected 로 남아 머지가 막힌다. changes 로 판단하고 gate 가 항상 보고한다.
on:
  push:
    branches: [main, dev]
  pull_request:

# 워크플로가 저장소를 읽기만 하면 되므로 토큰 권한을 최소로 제한한다.
permissions:
  contents: read

# 통합 브랜치는 취소하지 않는다. 그 커밋의 통과 기록이 사라진다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 서버와 관련된 변경이 있는지만 판단한다. 이 잡은 항상 돈다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 기본값이 저장소 기본 브랜치라, 그 설정이 바뀌면 관계없는 push 도 걸린다.
          base: ${{ github.ref_name }}
          filters: |
            server:
              - 'server/**'
              - 'common/**'
              - '.github/workflows/server-ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    # generateApiTypes 는 앱을 띄우고 기다린다. 매달리면 기본 6 시간을 쓴다.
    timeout-minutes: 20

    # 이 잡에만 건다. 위에 두면 docker 잡의 run 스텝도 server 에서 돈다.
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poudy
          POSTGRES_USER: poudy
          POSTGRES_PASSWORD: poudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poudy -d poudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # --no-daemon 을 쓰지 않는다. setup-gradle 이 데몬 재사용을 전제로 캐시를 관리한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # v5 부터 packageManager 를 보고 캐시를 켠다. 여기선 npx 만 쓰므로
      # 루트에 package.json 이 생기면 없는 pnpm 을 찾다 실패한다.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # 훅을 우회했거나 훅이 없는 채로 올라온 변경을 잡는다.
      - name: Regenerate OpenAPI artifacts
        run: ./gradlew generateApiTypes

      # git diff 는 추적되지 않는 파일을 보지 못해 생성물이 새로 생긴 경우를 놓친다.
      - name: Verify OpenAPI artifacts are up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- server/openapi.json common/api.d.ts)" ]; then
            echo "::error::OpenAPI 생성물이 최신이 아닙니다. './gradlew generateApiTypes' 실행 후 커밋하세요."
            git --no-pager diff -- server/openapi.json common/api.d.ts
            exit 1
          fi

      # 아래 build 는 integration 으로만 돈다. 로컬 기본값은 test 라, 여기서
      # 안 돌리면 application-test.yml 이 깨져도 CI 는 초록으로 남는다.
      - name: Test with H2 profile
        id: h2test
        run: ./gradlew test

      - name: Build and test
        id: test
        run: ./gradlew -Dspring.profiles.active=integration build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/poudy
          DB_USERNAME: poudy
          DB_PASSWORD: poudy

      # build 는 spotless 와 checkstyle 도 돌리므로 reports 를 통째로 올린다.
      - name: Upload reports
        if: failure() && (steps.h2test.outcome == 'failure' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: server-reports
          path: server/build/reports

  # Dockerfile 은 jar 가 하나뿐이라는 것과 jarmode 추출 레이아웃에 기대고 있다.
  # build 뒤에 둔다. 컨테이너 안에서 다시 빌드하므로 헛돌면 15 분이 낭비다.
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # prod 프로필은 접속 정보가 없으면 기동 시점에 실패한다.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poudy
          POSTGRES_USER: poudy
          POSTGRES_PASSWORD: poudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poudy -d poudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          # 아래에서 띄워 보려면 로컬 데몬에 올라와야 한다.
          load: true
          tags: poudy:ci
          cache-from: type=gha
          # 포크 PR 은 Actions 캐시에 쓸 수 없다. 읽기만 하고 쓰기는 건너뛴다.
          # 표현식은 참인 쪽이 빈 문자열이면 거짓으로 취급되므로 조건을 뒤집어 둔다.
          cache-to: ${{ !github.event.pull_request.head.repo.fork && 'type=gha,mode=max' || '' }}

      # JarLauncher 경로와 계층 파일 권한은 실제로 띄워야 드러난다.
      - name: Run image and check health
        run: |
          docker run -d --name poudy-ci --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/poudy \
            -e DB_USERNAME=poudy -e DB_PASSWORD=poudy \
            poudy:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "기동 확인"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=poudy-ci)" ]; then
              echo "::error::컨테이너가 종료되었습니다."
              docker logs poudy-ci
              exit 1
            fi
            sleep 2
          done

          echo "::error::60 초 안에 health 가 UP 이 되지 않았습니다."
          docker logs poudy-ci
          exit 1

  # 필수 체크로 걸 잡. 이 워크플로 안의 잡만 모으므로 Commit Lint 는 따로 등록한다.
  # !cancelled() 는 취소 시 skipped 가 되고 브랜치 보호가 이를 통과로 본다.
  gate:
    needs: [changes, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check results
        run: |
          for r in '${{ needs.changes.result }}' \
                   '${{ needs.build.result }}' \
                   '${{ needs.docker.result }}'; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::선행 잡이 $r 로 끝났습니다."; exit 1 ;;
            esac
          done
          echo "Server CI 통과"
