name: Server CI

# 기본 브랜치는 dev 다. main 만 감시하면 머지 커밋이 한 번도 검사되지 않는다.
# PR 각각이 통과해도 합쳐진 결과는 다를 수 있다. 특히 OpenAPI 생성물은 두 PR 이
# 각자 다른 엔드포인트를 더하면 머지 후 어느 쪽과도 달라진다.
#
# 워크플로 수준 paths 는 쓰지 않는다. paths 로 걸러 내면 서버와 무관한 PR 에서
# 워크플로가 아예 실행되지 않아, 필수 체크로 걸었을 때 Expected 로 남고 머지가
# 영원히 막힌다. 대신 changes 잡이 경로를 판단하고 무거운 잡에 if 를 걸며,
# gate 잡이 결과를 모아 항상 보고한다. 필수 체크는 gate 하나만 걸면 된다.
on:
  push:
    branches: [main, dev]
  pull_request:

# 워크플로가 저장소를 읽기만 하면 되므로 토큰 권한을 최소로 제한한다.
permissions:
  contents: read

# PR 은 연속 push 시 이전 실행을 취소한다. 통합 브랜치는 취소하지 않는다.
# 취소하면 그 커밋이 통과했는지에 대한 기록이 남지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 서버와 관련된 변경이 있는지만 판단한다. 이 잡은 항상 돈다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'common/**'
              - '.github/workflows/server-ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    # generateApiTypes 는 앱을 띄우고 응답을 기다린다. 기동이 매달리면
    # 기본 타임아웃 6 시간을 그대로 쓰므로 상한을 둔다.
    timeout-minutes: 20

    # 워크플로 전체가 아니라 이 잡에만 건다. 위에 두면 docker 잡에 run 스텝을
    # 추가했을 때 조용히 server 에서 실행된다.
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poudy
          POSTGRES_USER: poudy
          POSTGRES_PASSWORD: poudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poudy -d poudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 데몬을 끄지 않는다. setup-gradle 은 데몬 재사용을 전제로 캐시를 관리하고
      # 잡이 끝날 때 정리까지 맡는다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # v5 부터 package.json 의 packageManager 를 보고 캐시를 자동으로 켠다.
      # 여기서 Node 는 openapi-typescript 를 npx 로 한 번 돌리는 데만 쓰고,
      # 루트에 package.json 이 생기면 없는 pnpm 을 찾다 실패하므로 꺼 둔다.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # 커밋 훅을 우회했거나 훅이 설치되지 않은 채로 올라온 변경을 잡는다.
      # 다시 생성해서 커밋된 것과 다르면 실패시킨다.
      - name: Regenerate OpenAPI artifacts
        run: ./gradlew generateApiTypes

      # git diff 는 추적되지 않는 파일을 보지 못해 생성물이 새로 생긴 경우를 놓친다.
      - name: Verify OpenAPI artifacts are up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- server/openapi.json common/api.d.ts)" ]; then
            echo "::error::OpenAPI 생성물이 최신이 아닙니다. './gradlew generateApiTypes' 실행 후 커밋하세요."
            git --no-pager diff -- server/openapi.json common/api.d.ts
            exit 1
          fi

      - name: Build and test
        id: test
        run: ./gradlew -Dspring.profiles.active=integration build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/poudy
          DB_USERNAME: poudy
          DB_PASSWORD: poudy

      # 앞 단계에서 실패하면 테스트가 돈 적이 없어 보고서 경로가 비어 있다.
      - name: Upload test report
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: server/build/reports/tests/test

  # Dockerfile 은 build/libs 에 jar 가 하나뿐이라는 것과 jarmode 추출 레이아웃에
  # 기대고 있다. 여기서 빌드하지 않으면 그 전제가 깨져도 배포 시점까지 모른다.
  #
  # build 뒤에 둔다. 컨테이너 안에서 의존성을 다시 받고 bootJar 를 다시 만들기
  # 때문에, 테스트가 1 분 만에 깨져도 여기서 15 분을 더 쓴다.
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          cache-from: type=gha
          # 포크 PR 은 Actions 캐시에 쓸 수 없다. 읽기만 하고 쓰기는 건너뛴다.
          # 표현식은 참인 쪽이 빈 문자열이면 거짓으로 취급되므로 조건을 뒤집어 둔다.
          cache-to: ${{ !github.event.pull_request.head.repo.fork && 'type=gha,mode=max' || '' }}

  # 필수 체크로 걸 잡. always() 라서 앞 잡이 건너뛰어도 반드시 결과를 보고한다.
  # 서버와 무관한 PR 에서는 앞 잡이 skipped 로 끝나고 여기서 성공으로 마무리된다.
  # 브랜치 보호에는 이 잡 하나만 필수 체크로 등록하면 된다.
  gate:
    needs: [changes, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check results
        run: |
          for r in '${{ needs.changes.result }}' \
                   '${{ needs.build.result }}' \
                   '${{ needs.docker.result }}'; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::선행 잡이 $r 로 끝났습니다."; exit 1 ;;
            esac
          done
          echo "Server CI 통과"
