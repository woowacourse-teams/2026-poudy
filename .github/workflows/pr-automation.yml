name: PR Automation

# 포크 PR 은 pull_request 에서 토큰이 읽기 전용이라 레이블을 붙이지 못한다.
# pull_request_target 은 쓰기 권한을 주는 대신, PR 코드를 실행하면 그 권한이
# 그대로 넘어간다. 이 워크플로는 코드를 내려받지 않고 API 만 쓰므로 안전하다.
# actions/checkout 이나 빌드 스텝을 추가하면 그 전제가 깨진다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# pull_request_target 의 github.ref 는 베이스 브랜치라 모든 PR 이 한 그룹이 된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: 변경 경로 레이블
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
