name: PR Automation

# 포크 PR 은 pull_request 에서 토큰이 읽기 전용이라 레이블을 붙이지 못한다.
# pull_request_target 은 쓰기 권한을 주는 대신, PR 코드를 실행하면 그 권한이
# 그대로 넘어간다. 이 워크플로는 코드를 내려받지 않고 API 만 쓰므로 안전하다.
# actions/checkout 이나 빌드 스텝을 추가하면 그 전제가 깨진다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  label:
    name: 변경 경로 레이블
    if: github.event.action != 'edited'
    # pull_request_target 의 github.ref 는 베이스 브랜치라 모든 PR 이 한 그룹이 된다.
    # 잡마다 그룹을 나눠 제목 수정이 진행 중인 경로 레이블을 취소하지 않게 한다.
    concurrency:
      group: ${{ github.workflow }}-path-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true

  type-label:
    name: 제목 타입 레이블
    concurrency:
      group: ${{ github.workflow }}-type-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const types = ['build', 'ci', 'docs', 'feat', 'fix', 'perf', 'refactor', 'test'];

            const title = context.payload.pull_request.title || '';
            const match = title.match(/^([a-z]+)\s*:/);
            const picked = match && types.includes(match[1]) ? match[1] : null;

            if (!picked) {
              core.info(`제목에서 타입을 읽지 못했습니다: ${title}`);
              return;
            }

            const pr = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };

            const defined = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: pr.owner,
              repo: pr.repo,
            });

            if (!defined.some(l => l.name === picked)) {
              core.warning(`${picked} 레이블이 저장소에 없어 붙이지 않습니다. 먼저 만들어 주세요.`);
              return;
            }

            const current = context.payload.pull_request.labels.map(l => l.name);

            for (const stale of types.filter(t => t !== picked && current.includes(t))) {
              await github.rest.issues.removeLabel({ ...pr, name: stale });
              core.info(`${stale} 레이블 제거`);
            }

            if (current.includes(picked)) {
              core.info(`이미 ${picked} 레이블이 있습니다.`);
              return;
            }

            await github.rest.issues.addLabels({ ...pr, labels: [picked] });
            core.info(`${picked} 레이블 추가`);
