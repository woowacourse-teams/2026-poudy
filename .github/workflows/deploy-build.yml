name: Deployment Build

on:
  push:
    branches: [dev]
    paths:
      - "client/**"
      - "server/**"
      - "common/**"
      - "deploy/**"
      - ".github/workflows/deploy-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build deployment artifacts
    # t4g EC2 런타임과 동일한 ARM64 환경에서 네이티브 의존성을 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Package artifacts
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./deploy/scripts/package-artifacts.sh "$RUNNER_TEMP/poudy-artifacts"

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poudy-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/poudy-artifacts
          if-no-files-found: error
          retention-days: 7
