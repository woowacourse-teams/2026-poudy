name: Stale

# 매일 09:00 KST 에 방치된 이슈와 PR 을 정리한다.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

# 수동 실행이 스케줄 실행과 겹치면 같은 항목에 안내가 두 번 달린다.
# 취소하지 않고 기다리게 한다. 먼저 돈 실행이 레이블을 붙여 두면
# 뒤 실행은 같은 항목을 다시 건드리지 않는다.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 14
          days-before-close: 7

          stale-issue-label: stale
          stale-pr-label: stale

          stale-issue-message: |
            2주 동안 변화가 없어 `stale` 로 표시합니다.
            계속 진행 중이면 댓글을 남겨 주세요. 1주 뒤 자동으로 닫힙니다.
          stale-pr-message: |
            2주 동안 변화가 없어 `stale` 로 표시합니다.
            계속 진행 중이면 댓글을 남겨 주세요. 1주 뒤 자동으로 닫힙니다.

          close-issue-message: 활동이 없어 닫습니다. 필요하면 다시 열어 주세요.
          close-pr-message: 활동이 없어 닫습니다. 필요하면 다시 열어 주세요.

          # 긴급 건과 논의 중인 항목은 대상에서 뺀다.
          # 담당자와 마일스톤은 예외로 두지 않는다. PR 은 작성자가 직접 만들고
          # 직접 머지하므로 담당자 지정이 "다른 사람이 진행 중"을 뜻하지 않고,
          # 마일스톤은 쓰지 않는다. 예외로 두면 방치된 항목이 그대로 남는다.
          exempt-issue-labels: hotfix,question
          exempt-pr-labels: hotfix,question

          # 드래프트는 작성자가 아직 준비 중이라고 스스로 표시한 상태다.
          # 담당자 지정과 달리 의사 표시가 분명하므로 예외로 둔다.
          exempt-draft-pr: true

          # 기본값 30 이면 이슈와 PR 이 쌓였을 때 한 번에 다 처리하지 못하고
          # 남은 것은 다음 날로 밀린다.
          operations-per-run: 100

          # 한도에 걸렸을 때 오래된 것부터 본다. 지정하지 않으면 매번 같은 쪽부터
          # 처리해서 정작 정리해야 할 오래된 항목이 계속 뒤로 밀린다.
          ascending: true
