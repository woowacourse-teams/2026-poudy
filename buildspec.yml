version: 0.2

env:
  variables:
    PNPM_VERSION: "11.21.0"
    # Next.js의 NEXT_PUBLIC_* 값은 빌드 결과물에 포함되므로 CodeBuild에서 지정합니다.
    # 프론트와 백엔드는 같은 외부 origin을 사용하고, Nginx가 /api/*를 백엔드
    # 사설 IP로 중계하므로 API base URL은 비워 둡니다.
    NEXT_PUBLIC_API_MOCKING: ""
    NEXT_PUBLIC_API_BASE_URL: ""
    NEXT_PUBLIC_ENVIRONMENT: "production"

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 22
    commands:
      - npm install --global "pnpm@${PNPM_VERSION}"
  pre_build:
    commands:
      - test "$(uname -m)" = "aarch64"
      - rm -rf "${CODEBUILD_SRC_DIR}/.poudy-package" "${CODEBUILD_SRC_DIR}/.artifacts"
  build:
    commands:
      # 배포 산출물의 버전은 main 에 붙은 릴리스 태그에서 온다. 같은 phase 에서 export 해야
      # 아래 패키징 스크립트가 실행하는 Gradle 까지 값이 전달된다.
      - |
        described=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)
        if [ -n "$described" ]; then
          export APP_VERSION="${described#v}"
        else
          export APP_VERSION="0.0.0-${CODEBUILD_RESOLVED_SOURCE_VERSION}"
          echo "릴리스 태그를 찾지 못해 커밋으로 대체합니다. CodeBuild 의 git clone depth 가 얕으면 태그가 내려오지 않습니다."
        fi
        echo "APP_VERSION=${APP_VERSION}"
      - ./deploy/scripts/package-artifacts.sh "${CODEBUILD_SRC_DIR}/.poudy-package"
      - mkdir -p "${CODEBUILD_SRC_DIR}/.artifacts/backend/app" "${CODEBUILD_SRC_DIR}/.artifacts/backend/scripts"
      - mkdir -p "${CODEBUILD_SRC_DIR}/.artifacts/frontend/app" "${CODEBUILD_SRC_DIR}/.artifacts/frontend/scripts" "${CODEBUILD_SRC_DIR}/.artifacts/frontend/nginx"
      - cp "${CODEBUILD_SRC_DIR}/.poudy-package/backend/app.jar" "${CODEBUILD_SRC_DIR}/.artifacts/backend/app/app.jar"
      - cp -R "${CODEBUILD_SRC_DIR}/.poudy-package/frontend/." "${CODEBUILD_SRC_DIR}/.artifacts/frontend/app/"
      - cp deploy/codedeploy/backend/appspec.yml "${CODEBUILD_SRC_DIR}/.artifacts/backend/appspec.yml"
      - cp deploy/codedeploy/frontend/appspec.yml "${CODEBUILD_SRC_DIR}/.artifacts/frontend/appspec.yml"
      - cp -R deploy/codedeploy/backend/scripts/. "${CODEBUILD_SRC_DIR}/.artifacts/backend/scripts/"
      - cp -R deploy/codedeploy/frontend/scripts/. "${CODEBUILD_SRC_DIR}/.artifacts/frontend/scripts/"
      - cp deploy/nginx/ec2-frontend.conf deploy/nginx/ec2-frontend-https.conf "${CODEBUILD_SRC_DIR}/.artifacts/frontend/nginx/"
      - chmod +x "${CODEBUILD_SRC_DIR}/.artifacts/backend/scripts/"*.sh "${CODEBUILD_SRC_DIR}/.artifacts/frontend/scripts/"*.sh
      - printf 'commit=%s\nversion=%s\n' "${CODEBUILD_RESOLVED_SOURCE_VERSION}" "${APP_VERSION}" > "${CODEBUILD_SRC_DIR}/.artifacts/build-metadata.txt"
  post_build:
    commands:
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/backend/app/app.jar"
      - test -f "${CODEBUILD_SRC_DIR}/.artifacts/frontend/app/server.js"

artifacts:
  files:
    - .artifacts/build-metadata.txt
  discard-paths: yes
  secondary-artifacts:
    backend:
      base-directory: .artifacts/backend
      files:
        - appspec.yml
        - scripts/**/*
        - app/**/*
      name: poudy-backend-$CODEBUILD_RESOLVED_SOURCE_VERSION
    frontend:
      base-directory: .artifacts/frontend
      files:
        - appspec.yml
        - scripts/**/*
        - nginx/**/*
        - app/**/*
      name: poudy-frontend-$CODEBUILD_RESOLVED_SOURCE_VERSION
